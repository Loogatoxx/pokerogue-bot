<!doctype html>
<!--
  Aperçu du panneau sans jouer : affiche une vraie observation produite par le simulateur.
  Outil de développement, hors de l'extension. Pour l'ouvrir :
    python3 -m http.server 8765 --directory extension   puis   http://127.0.0.1:8765/apercu.html
  Pour régénérer l'observation :
    EXPORT_OBSERVATION=$PWD/extension/apercu-observation.json ./simulateur/lancer-tests.sh
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aperçu du panneau</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #2d2b45; color: #cfcce6; font: 14px system-ui, sans-serif; }
    p { padding: 24px; max-width: 380px; }
  </style>
</head>
<body>
  <p>Aperçu du panneau de l'extension, alimenté par une observation réelle du simulateur
     (<code>apercu-observation.json</code>).</p>
  <script src="dist/panneau.js"></script>
  <script>
    fetch("apercu-observation.json")
      .then(r => r.json())
      .then(observation => {
        const envoyer = () => window.postMessage({ source: "pokerogue-cerveau", origine: "capteur", type: "observation", observation }, location.origin);
        envoyer();
        setInterval(envoyer, 1000);
      });
  </script>
</body>
</html>
