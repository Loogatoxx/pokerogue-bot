# Réglages de l'entraînement du cerveau — c'est ici que tu pilotes son apprentissage.
# Modifie une valeur, relance l'entraînement, et compare les courbes dans le tableau de bord.

[recompenses]
# Ce que le cerveau cherche à maximiser. Il ne « comprend » que ces points : ce sont eux qui
# lui disent ce qui est bien ou mal.
vague_gagnee = 1.0       # chaque vague franchie
ko_subi = -0.3           # chaque Pokémon de l'équipe mis K.O.
degats_infliges = 0.2    # pour 100 % des PV d'un adversaire retirés (coup de pouce au début)
capture = 0.5            # chaque Pokémon capturé qui agrandit l'équipe
capture_remplacement = 0.0  # capturé à la place d'un membre : 0,5 dans les entraînements 6-7, qui ont empiré

defaite = 0.0            # partie perdue (en plus de ne plus gagner de vagues)

[partie]
# Programme progressif : au-delà de cette vague, la partie s'arrête (comme un élève à qui on
# ne donne d'abord que les premiers exercices). À relever quand il y arrive souvent.
vague_max = 120              # 75 → 120 le 01/10 : la v4 (planificateur) atteint la vague 115
# « fixe » ou « changer » (le jeu propose de changer de Pokémon après chaque K.O. adverse).
style_combat = "fixe"
# « hasard » : trois des 27 starters d'un compte neuf, tirés à chaque partie (comme un humain qui
# choisit les siens) ; « kanto » : toujours Bulbizarre, Salamèche et Carapuce (entraînements 1 à 3).
starters = "hasard"
# Entraînement ciblé (01/10) : part des parties qui repartent d'une photo prise au début d'un combat
# qui bloque, plutôt que de la vague 1. 55 % des défaites avaient lieu contre le rival (vagues 8 et
# 25) : on s'y exerce bien plus souvent. Les photos viennent des parties elles-mêmes (vraies équipes).
entrainement_cible = 0.5
photos_vagues = [20, 25, 30, 40, 50, 55, 66, 80, 90, 95]  # 01/10 : avec le planificateur, le rival 1 passe à ~100 %

[apprentissage]
simulateurs = 8                 # copies du jeu en parallèle
decisions_par_collecte = 256    # décisions jouées par chaque copie avant chaque mise à jour
gamma = 0.99                    # importance du futur (0 = seul l'immédiat compte, 1 = tout)
lambda_gae = 0.95               # lissage de l'estimation « ce coup a-t-il été bon ? »
taux_apprentissage = 0.0001     # taille des pas d'ajustement des poids (0,00025 jusqu'à l'entraînement 7 ; plus petit pour affiner un cerveau déjà correct)
epoques = 4                     # passages sur chaque collecte
mini_lots = 4                   # découpage de chaque collecte pendant l'apprentissage
clip = 0.2                      # « petits pas » de PPO : écart maximal avec l'ancienne politique
coef_entropie = 0.015           # encourage à explorer ; 0,01 : figé vers 0,3 (entrainement-1) ; 0,02 : monte à 0,84 avec les starters au hasard (essai-async-8-anims)
coef_valeur = 0.5               # poids de l'apprentissage de la tête « valeur »
norme_gradient_max = 0.5        # garde-fou contre les ajustements trop brutaux

[sauvegarde]
cerveau_toutes_les = 10         # un fichier .cerveau toutes les N mises à jour (sur le Lexar)
